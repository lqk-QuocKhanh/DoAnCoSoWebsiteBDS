version: "3.9"

services:

  # ── SQL Server ───────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vietpropestate-sqlserver
    environment:
      SA_PASSWORD: "VietProp@SqlServer2024!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P VietProp@SqlServer2024! -No -Q 'SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - vietprop-network

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vietpropestate-redis
    command: redis-server --requirepass "VietProp@Redis2024!" --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "VietProp@Redis2024!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vietprop-network

  # ── Web API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vietpropestate-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;Database=VietPropEstateDb;
        User Id=sa;Password=VietProp@SqlServer2024!;
        TrustServerCertificate=True;MultipleActiveResultSets=true
      ConnectionStrings__Redis: "redis:6379,password=VietProp@Redis2024!"
      JwtSettings__Secret: "${JWT_SECRET:-VietPropEstate-Super-Secret-Key-2024-At-Least-32-Characters-Long}"
      JwtSettings__Issuer: "VietPropEstate.WebAPI"
      JwtSettings__Audience: "VietPropEstate.BlazorUI"
      JwtSettings__ExpiryMinutes: "60"
      Cors__AllowedOrigins__0: "http://localhost:5126"
      Cors__AllowedOrigins__1: "https://localhost:7121"
      EnableSwagger: "true"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vietprop-network

volumes:
  sqlserver_data:
  redis_data:

networks:
  vietprop-network:
    driver: bridge
