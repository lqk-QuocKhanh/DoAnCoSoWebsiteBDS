version: "3.9"

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vietpropestate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "VietProp@Postgres2024!"
      POSTGRES_DB: vietpropestate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vietpropestate"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - vietprop-network

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vietpropestate-redis
    command: redis-server --requirepass "VietProp@Redis2024!" --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "VietProp@Redis2024!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vietprop-network

  # ── Web API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: vietpropestate-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=vietpropestate;
        Username=postgres;Password=VietProp@Postgres2024!
      ConnectionStrings__Redis: "redis:6379,password=VietProp@Redis2024!"
      JwtSettings__Secret: "${JWT_SECRET:-VietPropEstate-Super-Secret-Key-2024-At-Least-32-Characters-Long}"
      JwtSettings__Issuer: "VietPropEstate.WebAPI"
      JwtSettings__Audience: "VietPropEstate.BlazorUI"
      JwtSettings__ExpiryMinutes: "60"
      Cors__AllowedOrigins__0: "http://localhost:5126"
      Cors__AllowedOrigins__1: "https://localhost:7121"
      EnableSwagger: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vietprop-network

volumes:
  postgres_data:
  redis_data:

networks:
  vietprop-network:
    driver: bridge
