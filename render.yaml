# Render Blueprint — VietPropEstate
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: doancosowebsitebds-ui
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: API_BASE_URL
        value: https://doancosowebsitebds-api.onrender.com
      - key: ApiSettings__BaseUrl
        value: https://doancosowebsitebds-api.onrender.com

  - type: web
    name: doancosowebsitebds-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: EnableSwagger
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ConnectionStrings__Redis
        sync: false
      - key: JwtSettings__Secret
        generateValue: true
      - key: JwtSettings__Issuer
        value: VietPropEstate.WebAPI
      - key: JwtSettings__Audience
        value: VietPropEstate.BlazorUI
      - key: Cors__AllowedOrigins__0
        value: https://doancosowebsitebds-ui.onrender.com
      - key: Cors__AllowedOrigins__1
        value: http://localhost:5126
